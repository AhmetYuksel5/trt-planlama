# Firebase Hosting'e yayın: main'e her gönderimde docs/ (derlenmiş uygulama)
# plannersflow.net'e (projenin kendi sitesi planners-flow-2026) çıkıyor, Firestore kuralları da depodakiyle
# eşitleniyor; kuralları konsola elle yapıştırmak gerekmesin.
#
# Anahtar: depo ayarlarında FIREBASE_SERVICE_ACCOUNT gizli değeri (Firebase
# konsolu › Proje ayarları › Hizmet hesapları › Yeni özel anahtar). Yoksa
# iş uyarıyla atlanıyor, kırmızıya dönmüyor. Derleme burada yapılmıyor:
# docs/ depoda derlenmiş duruyor (CLAUDE.md), GitHub Pages ile aynı çıktı.
name: Firebase yayın

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-yayin
  cancel-in-progress: false

jobs:
  yayin:
    runs-on: ubuntu-latest
    env:
      ANAHTAR: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Anahtar var mı
        id: anahtar
        run: |
          if [ -z "$ANAHTAR" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT gizli değeri yok; yayın atlandı."
            echo "var=hayir" >> "$GITHUB_OUTPUT"
          else
            echo "var=evet" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.anahtar.outputs.var == 'evet'

      - uses: actions/setup-node@v4
        if: steps.anahtar.outputs.var == 'evet'
        with:
          node-version: 20

      - name: Anahtarı dosyaya yaz
        if: steps.anahtar.outputs.var == 'evet'
        run: printf '%s' "$ANAHTAR" > "$RUNNER_TEMP/anahtar.json"

      # Kimlik doğrulanamazsa nedeni görünsün: biçim bozuk mu, başka proje mi,
      # silinmiş anahtar mı (kimliğin başı konsoldaki anahtar listesiyle
      # karşılaştırılır). Gizli anahtarın kendisi yazılmıyor.
      - name: Anahtarı denetle
        if: steps.anahtar.outputs.var == 'evet'
        run: |
          node -e '
            const fs = require("fs");
            const yol = process.env.RUNNER_TEMP + "/anahtar.json";
            // Yapıştırırken araya giren boşluk ve karakterler: { ile } arası alınıyor.
            const ham = fs.readFileSync(yol, "utf8").replace(/^\uFEFF/, "");
            const bas = ham.indexOf("{"), son = ham.lastIndexOf("}");
            // Dıştaki { } seçilmeden kopyalandıysa içerik yine tam: çerçeve yeniden ekleniyor.
            const metin = bas >= 0 && son > bas ? ham.slice(bas, son + 1) : "{" + ham.trim().replace(/,\s*$/, "") + "}";
            let a;
            try { a = JSON.parse(metin); }
            catch (e) {
              console.log("::error::Anahtar JSON değil; dosyanın tamamı kopyalanmamış olabilir.");
              console.log("Uzunluk: " + ham.length + ", { var: " + (bas >= 0) + ", } var: " + (son >= 0) + ", özel anahtar satırı var: " + ham.includes("BEGIN PRIVATE KEY") + ", sonu var: " + ham.includes("END PRIVATE KEY"));
              process.exit(1);
            }
            fs.writeFileSync(yol, JSON.stringify(a));
            if (a.type !== "service_account" || !a.private_key || !a.client_email) { console.log("::error::Bu bir hizmet hesabı anahtarı değil ya da eksik."); process.exit(1); }
            if (a.project_id !== "planners-flow-2026") { console.log("::error::Anahtar başka projenin: " + a.project_id); process.exit(1); }
            console.log("Hesap: " + a.client_email);
            console.log("Anahtar kimliğinin başı: " + String(a.private_key_id).slice(0, 6));
          '

      - name: Hosting
        if: steps.anahtar.outputs.var == 'evet'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/anahtar.json
        run: npx --yes firebase-tools@13 deploy --only hosting:uygulama --project planners-flow-2026 --non-interactive

      - name: Firestore kuralları
        if: steps.anahtar.outputs.var == 'evet'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/anahtar.json
        run: npx --yes firebase-tools@13 deploy --only firestore:rules --project planners-flow-2026 --non-interactive

      - name: Anahtarı sil
        if: always() && steps.anahtar.outputs.var == 'evet'
        run: rm -f "$RUNNER_TEMP/anahtar.json"
